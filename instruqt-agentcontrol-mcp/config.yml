version: "3"
virtualbrowsers:
- name: launchdarkly
  url: https://i3vcudz5ncoet6xkoaqxnos7mu0sdcpz.lambda-url.us-east-2.on.aws/?sandboxId=${_SANDBOX_ID}
virtualmachines:
- name: workstation
  image: launchdarkly/workshop-ai-configs
  shell: /bin/bash
  # Bumped from n1-standard-2: this track runs code-server, uvicorn, the
  # evaluator-tracker traffic loop, and Claude Code on the same box.
  machine_type: n1-standard-4
secrets:
- name: AWS_ACCESS_KEY_ID
- name: AWS_SECRET_ACCESS_KEY
- name: AWS_REGION
- name: LAUNCHDARKLY_ACCESS_TOKEN
