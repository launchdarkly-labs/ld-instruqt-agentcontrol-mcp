title: Govern an AI Agent with AgentControl and MCP
teaser: >-
  Build an AI assistant, grade it with a judge, and hold its shakiest answers
  for a human — driving LaunchDarkly entirely from your coding agent.
description: >-
  AgentControl lets you treat prompts, models, and quality gates as runtime
  configuration instead of hardcoded values. In this track you'll build Otto — the
  shopping assistant for ToggleWear, a fictional online retailer of LaunchDarkly-branded
  apparel. You won't click through the LaunchDarkly UI to do it. Instead you'll connect
  Claude Code to the LaunchDarkly MCP server and ask for what you want in plain
  language: a Config for Otto, a custom judge that scores whether he sounds on-brand,
  and a review gate that ships his confident answers, holds the borderline ones for a
  human, and suppresses the bad ones. By the end Otto is live, graded, and governed —
  and you've done it without touching deployment.
