title: Control Freak — Hands-On with AgentControl and MCP
teaser: Take an AI assistant from placeholder line to a guarded rollout. Iterate prompts,
  route by tier, evaluate offline, ship behind a safety net — asking a coding agent
  for the pieces instead of clicking them.
description: 'AgentControl lets you treat prompts, models, and targeting as runtime
  configuration instead of hardcoded values. In this track you''ll build Otto — the
  shopping assistant for ToggleWear, a fictional online retailer of LaunchDarkly-branded
  apparel. You''ll create his first Config, route premium shoppers to a more capable
  model, iterate on his personality without redeploying, grade him offline against
  a golden dataset, and ship a risky new model behind a guarded rollout that
  auto-reverts when quality drops. The Configs, variations and judge you create by
  asking Claude Code over LaunchDarkly''s MCP server rather than clicking them; the
  targeting, the evaluation and the rollout you drive in the UI. By the end Otto is
  live, tier-aware, evaluated and guarded — and you''ve done it without touching
  deployment.'
